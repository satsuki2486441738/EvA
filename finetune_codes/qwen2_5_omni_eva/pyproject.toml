[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen2_5_omni_eva"
version = "0.1.0"
description = "Qwen2.5-Omni-EvA: Qwen2.5-Omni with CED dual-stream architecture"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers",
    "eva_processor",
]

[tool.setuptools]
packages = ["qwen2_5_omni_eva"]

[tool.setuptools.package-dir]
"qwen2_5_omni_eva" = "."
