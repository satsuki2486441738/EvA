[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi_audio_eva"
version = "0.1.0"
description = "Kimi-Audio-EvA training codebase (formerly finetune_codes)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers",
    "eva_processor",
]

[tool.setuptools]
packages = ["kimi_audio_eva"]

[tool.setuptools.package-dir]
"kimi_audio_eva" = "."
