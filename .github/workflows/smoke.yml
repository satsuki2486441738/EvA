name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch transformers
          pip install -e finetune_codes/eva_processor
          pip install -e finetune_codes/kimi_audio_eva --no-deps
          pip install -e finetune_codes/qwen2_5_omni_eva --no-deps
      - name: Compile first-party source
        run: python -m compileall -q -x 'src/third_party' .
      - name: Run smoke tests
        run: pytest demo/tests
