# Repository-level Python tool configuration for lint, format, and pytest.
# This is not a package definition file; eva_processor, qwen2_5_omni_eva, and
# kimi_audio_eva each have their own pyproject.toml.

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    src/third_party/kimia_infer/models/tokenizer/glm4
  | outputs
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["eva_processor", "kimi_audio_eva", "qwen2_5_omni_eva", "kimia_infer"]
skip = ["src/third_party/kimia_infer/models/tokenizer/glm4"]

[tool.pytest.ini_options]
testpaths = ["demo/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
